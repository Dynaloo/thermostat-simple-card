name: Upload Release Asset

on:
  release:
    types: [published]

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permet au script d'ajouter des fichiers aux releases
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event.release.tag_name }}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Erreur : Le tag de la release '${tag}' doit être au format SemVer avec un 'v' (ex: v0.1.0)." >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Javascript Bundle
        run: npm run build

      - name: Upload JS Bundle to Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/thermostat-simple-card.js
          asset_name: thermostat-simple-card.js
          tag: ${{ github.event.release.tag_name }}
          overwrite: true
